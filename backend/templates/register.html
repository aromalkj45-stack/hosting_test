<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f2f4f7;
        }

        .register-container {

            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .register-container h1 {

            text-align: center;

            margin-bottom: 10px;

            color: #222;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333;
        }

        .form-group input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus {

            border-color: #007bff;
        }

        .register-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #007bff;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-button:hover {

            background: #0056b3;
        }

        .login-link {

            text-align: center;

            margin-top: 25px;

            color: #666;
        }

        .login-link a {

            color: #007bff;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {

            text-decoration: underline;
        }

        .message {

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 6px;

            text-align: center;
        }

        .success {

            background: #d4edda;

            color: #155724;
        }

        .error {

            background: #f8d7da;

            color: #721c24;
        }

    </style>

</head>


<body>


<div class="register-container">

    <h1>Create Account</h1>

    <p class="subtitle">
        Register a new account
    </p>


    <!-- Flask Messages -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- Registration Form -->

    <form
        method="POST"
        action="{{ url_for('register') }}"
    >


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label for="confirm_password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm your password"
                minlength="6"
                required
            >

        </div>


        <button
            type="submit"
            class="register-button">

            Create Account

        </button>


    </form>


    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>


</div>


</body>

</html>
