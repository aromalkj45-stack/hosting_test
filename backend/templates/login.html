<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f4f7;
        }

        .login-container {
            width: 400px;
            max-width: 90%;

            background: #ffffff;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .login-container h1 {
            text-align: center;

            margin-bottom: 10px;

            color: #222222;
        }

        .subtitle {
            text-align: center;

            color: #777777;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #333333;
        }

        .form-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #cccccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #007bff;

            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.10);
        }

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #007bff;

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        .login-button:hover {
            background: #0056b3;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .register-link {
            text-align: center;

            margin-top: 25px;

            color: #666666;
        }

        .register-link a {
            color: #007bff;

            text-decoration: none;

            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;

            margin-bottom: 20px;

            border-radius: 6px;

            text-align: center;

            font-size: 14px;
        }

        .success {
            background: #d4edda;

            color: #155724;
        }

        .error {
            background: #f8d7da;

            color: #721c24;
        }

        .warning {
            background: #fff3cd;

            color: #856404;
        }

        .info {
            background: #d1ecf1;

            color: #0c5460;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to your account
    </p>


    <!-- =============================== -->
    <!-- Flask Flash Messages             -->
    <!-- =============================== -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- =============================== -->
    <!-- Login Form                       -->
    <!-- =============================== -->

    <form method="POST" action="{{ url_for('login') }}">

        <!-- Username -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

        </div>


        <!-- Password -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- Login Button -->

        <button
            type="submit"
            class="login-button">

            Login

        </button>

    </form>


    <!-- =============================== -->
    <!-- Registration Link                -->
    <!-- =============================== -->

    <div class="register-link">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create an account
        </a>

    </div>


</div>


</body>

</html>
